name: Dependency Updates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          renovate-version: '44.14.12' # renovate: datasource=npm depName=renovate
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
      - name: Dispatch CI for Renovate pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --label dependencies --json headRefName --jq '.[].headRefName' |
            while IFS= read -r branch; do gh workflow run ci.yml --ref "$branch"; done

  mise-lock:
    name: mise lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.6.0' # renovate: datasource=github-releases depName=jdx/mise
          install: false
      - name: Refresh lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/dots lock
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: mise-pr
        with:
          branch: automation/update-mise-lock
          delete-branch: true
          commit-message: 'chore(deps): update mise lockfile'
          title: 'chore(deps): update mise lockfile'
          body: |
            miseのtool version・download URL・checksumを更新します。
            3日未満のreleaseは取り込みません。
          labels: dependencies
      - name: Dispatch CI for mise lockfile pull request
        if: steps.mise-pr.outputs.pull-request-operation == 'created' || steps.mise-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/update-mise-lock
