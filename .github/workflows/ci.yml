name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks で履歴全体を検査する
      # mise の宣言 (common/mise/.config/mise/config.toml の node = "lts") とローカルの node を揃える。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck stow
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1' # renovate: datasource=github-releases depName=gitleaks/gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Install Pi test dependencies
        run: |
          npm install --global "$(grep '^@earendil-works/pi-coding-agent@' config/packages.npm.txt)"
          pi install npm:pi-cursor-agent@0.4.4
      - name: Run canonical checks
        run: scripts/dots check
