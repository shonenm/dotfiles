[[keybindings.command]]
name = "projects"
key = "prefix+F"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui pick'"
description = "Projects (ghq / zoxide)"
width = "85%"
height = "80%"

[[keybindings.command]]
name = "project-root"
key = "prefix+9"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui root'"
description = "Project root session"

[[keybindings.command]]
name = "session-space"
key = "prefix+ctrl+s"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui space'"
description = "Session space"

# shell はclientのマシンでpopupなしに実行する。親PIDで対象clientを特定する。
[[keybindings.command]]
name = "next-space"
key = "ctrl+alt+j"
type = "shell"
command = "client_pid=$PPID; exec ~/dotfiles/scripts/tmux-default-shell -lc \"~/dotfiles/scripts/tui space-nav next $client_pid\""
description = "Next local space"

[[keybindings.command]]
name = "previous-space"
key = "ctrl+alt+k"
type = "shell"
command = "client_pid=$PPID; exec ~/dotfiles/scripts/tmux-default-shell -lc \"~/dotfiles/scripts/tui space-nav prev $client_pid\""
description = "Previous local space"

[[keybindings.command]]
name = "lazygit"
key = "prefix+g"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'lazygit'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "editor"
key = "prefix+k"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'nvim .'"
width = "90%"
height = "90%"

[[keybindings.command]]
name = "live-pr"
key = "prefix+G"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'live-pr'"
width = "85%"
height = "85%"

[[keybindings.command]]
name = "pgcli"
key = "prefix+P"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'pgcli \"${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postgres}\"'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "quay"
key = "prefix+Q"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'quay'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "dev"
key = "prefix+N"
type = "shell"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui dev'"
description = "Claude, Neovim and shell workspace"

[[keybindings.copy_pipe]]
key = "y"
command = "~/dotfiles/scripts/clipboard-copy"
