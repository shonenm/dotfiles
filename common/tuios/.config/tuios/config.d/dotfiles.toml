prefix_select_3 = []
prefix_select_4 = []
prefix_select_5 = []
prefix_select_6 = []
prefix_select_7 = []
prefix_select_8 = []
prefix_select_9 = []
switch_workspace_1 = ["1"]
switch_workspace_2 = ["2"]
switch_workspace_3 = ["3"]
switch_workspace_4 = ["4"]
switch_workspace_5 = ["5"]
switch_workspace_6 = ["6"]
switch_workspace_7 = ["7"]
switch_workspace_8 = ["8"]
reload_config = ["r"]
prefix_tape = []
prefix_minimize = []
prefix_workspace_switcher = ["w"]
prefix_workspace = []
prefix_split_horizontal = ["-"]
prefix_split_vertical = ["|", "\\"]
prefix_selection = ["v", "[", "u", "ctrl+u"]
prefix_review = ["ctrl+v"]
prefix_rename_window = ["t"]
rename_workspace = ["T"]
close_workspace = []
prefix_close_window = []
prefix_exit_mode = []
prefix_close_session = []
last_session = ["tab"]
prefix_layout = ["l", "ctrl+t"]
prefix_toggle_other_rail = []
prefix_toggle_spotlight = []
resize_pane_left_5 = ["H"]
resize_pane_down_5 = ["J"]
resize_pane_up_5 = ["K"]
resize_pane_right_5 = ["L"]
prev_workspace = ["p", "ctrl+h"]
next_workspace = ["n", "ctrl+l"]
prefix_toggle_sidebar = ["A", "b"]
prefix_agents_settings = ["ctrl+a"]
prefix_inbox = ["a", "i"]
