# tmux の session / window / pane は TUIOS の session / workspace / window に対応。
# config.toml は TUIOS の設定画面・hosts 管理用に残す。
# command は共通shell resolverからlogin shellで実行し、user toolsのPATHを揃える。
[startup]
daemon = true
tiled = true
start_in_terminal_mode = true
layout = "bsp"

[appearance]
# tmux の pane-active-border-style 相当の mode 色は themes/tokyonight-tmux.json で定義する。
theme = "tokyonight-tmux"
motion = "none"
scrollback_lines = 5000
nvim_navigation = true
new_window_inherit_cwd = true
auto_enter_terminal_on_focus = "off"
focus_follows_mouse = false
dockbar_position = "bottom"
# tmux の pane-border-status 相当。title は shared_borders 無効時のみ描画される。
# dim_unfocused は theme 設定時に背景を塗り透過を消すため使わない。
shared_borders = false
window_title_format = "{index}: {title}"
hide_window_buttons = true
# theme の border.unfocused は背景とのコントラスト補正で明るくなるため、設定値で固定する。
# focus 側の border_focused_color は mode 色を消すので使わない（themes/tokyonight-tmux.json）。
border_unfocused_color = "#3b4261"
zoom_size = 100
prefix_repeat_time = 1000
show_cpu = true
show_ram = true
show_clock = true

[appearance.sidebar]
position = "left"
width = 32
sections = "sessions,agents,custom"
show_agents = true

# tmux sidebar の USAGE 相当 (ai-usage)。tmux と同じく最下部に置く。session 一覧は標準 sessions 欄だけ。
[appearance.sidebar.custom]
title = "usage"
command = "~/dotfiles/scripts/tui usage"
refresh = "30s"

# tmux.expose 相当。pane navigator を画面カード一覧で開く。
[panes]
navigator_layout = "cards"

# tmux status-right 相当。mode・prefix・copy表示はdock標準のpillを使う。
[dock]
right = ["transfers", "notifications", "copy-help", "cpu", "ram", "custom/gpu", "custom/storage", "custom/agents", "custom/branch", "clock", "custom/host", "session-controls"]

[dock.clock]
format = "01/02 15:04"

[dock.custom.gpu]
command = "~/dotfiles/scripts/tui dock gpu"
refresh = "5s"

[dock.custom.storage]
command = "~/dotfiles/scripts/tui dock storage"
refresh = "60s"

# tmux の Claude badge / hang 表示相当。表示中 session の agent 数と状態色。
[dock.custom.agents]
command = "~/dotfiles/scripts/tui dock agents"
refresh = "3s"

[dock.custom.branch]
command = "~/dotfiles/scripts/tui dock branch"
refresh = "3s"

[dock.custom.host]
command = "hostname -s"

[daemon]
window_size = "latest"
persist_scrollback = true
resume_agents = "ask"

# tmux の session-window-changed と同じく、focus した pane の AI 通知を消す。
# daemon が実行するため、変更は tuios kill-server 後に反映される。
[hooks]
after-focus-change = ["~/dotfiles/scripts/tmux-claude-focus.sh"]

[tape]
autorun = "ask"

[keybindings]
leader_key = "ctrl+space"

