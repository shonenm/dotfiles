prefix_mail = []

# 確認なしで閉じる Window mode のキーは使わない。閉じるのは prefix x / X の確認付き command。
[keybindings.window_management]
close_window = []

[keybindings.global]
command_palette = []
launcher = []
prev_session = ["ctrl+alt+h", "alt+h"]
next_session = ["ctrl+alt+l", "alt+l"]

[keybindings.layout]
preselect_left = []
preselect_right = []
preselect_up = []
preselect_down = []

[keybindings.terminal_mode]
terminal_focus_left = ["ctrl+h"]
terminal_focus_down = ["ctrl+j"]
terminal_focus_up = ["ctrl+k"]
terminal_focus_right = ["ctrl+l"]
terminal_next_window = []
terminal_prev_window = []
prefix_fullscreen = ["ctrl+z"]

[[keybindings.command]]
name = "projects"
key = "prefix+F"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui pick'"
description = "Projects (ghq / zoxide)"
width = "85%"
height = "80%"

[[keybindings.command]]
name = "project-root"
key = "prefix+9"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui root'"
description = "Project root session"

[[keybindings.command]]
name = "session-space"
key = "prefix+ctrl+s"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui space'"
description = "Session space"

# shell はclientのマシンでpopupなしに実行する。親PIDで対象clientを特定する。
[[keybindings.command]]
name = "next-space"
key = "ctrl+alt+j"
type = "shell"
command = "client_pid=$PPID; exec ~/dotfiles/scripts/tmux-default-shell -lc \"~/dotfiles/scripts/tui space-nav next $client_pid\""
description = "Next local space"

[[keybindings.command]]
name = "previous-space"
key = "ctrl+alt+k"
type = "shell"
command = "client_pid=$PPID; exec ~/dotfiles/scripts/tmux-default-shell -lc \"~/dotfiles/scripts/tui space-nav prev $client_pid\""
description = "Previous local space"

# rcon container session では pane と同じ container・cwd で開く。
[[keybindings.command]]
name = "lazygit"
key = "prefix+g"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tmux-popup-in-container lazygit'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "editor"
key = "prefix+k"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc 'nvim .'"
width = "90%"
height = "90%"

[[keybindings.command]]
name = "live-pr"
key = "prefix+G"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tmux-popup-in-container live-pr'"
width = "85%"
height = "85%"

[[keybindings.command]]
name = "pgcli"
key = "prefix+P"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tmux-popup-in-container pgcli \"${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postgres}\"'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "quay"
key = "prefix+Q"
type = "scratch"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tmux-popup-in-container quay'"
width = "80%"
height = "80%"

[[keybindings.command]]
name = "dev"
key = "prefix+N"
type = "shell"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui dev'"
description = "Claude, Neovim and shell workspace"

[[keybindings.command]]
name = "theme"
key = "prefix+y"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui theme'"
description = "Theme (this client only)"
width = "40%"
height = "60%"

[[keybindings.command]]
name = "swap-pane"
key = "prefix+m"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui swap'"
description = "Swap the focused pane with a picked pane"
width = "80%"
height = "40%"

# prefix Esc は何もしない。割り当てがないと Esc が pane へ渡るため no-op を置く。
[[keybindings.command]]
name = "prefix-escape-noop"
key = "prefix+esc"
type = "shell"
command = "true"
description = "Do nothing"

# tmux の confirm-before。TUIOS 標準の close は確認しないため popup で y/n を聞く。
[[keybindings.command]]
name = "kill-pane"
key = "prefix+x"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui confirm pane'"
description = "Close the focused pane after confirming"
width = "40%"
height = "5"

[[keybindings.command]]
name = "kill-workspace"
key = "prefix+X"
type = "popup"
command = "~/dotfiles/scripts/tmux-default-shell -lc '~/dotfiles/scripts/tui confirm workspace'"
description = "Close the focused workspace after confirming"
width = "40%"
height = "5"

[[keybindings.copy_pipe]]
key = "y"
command = "~/dotfiles/scripts/clipboard-copy"
