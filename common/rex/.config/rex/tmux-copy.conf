# rex-tmux-copy が copy mode 用 tmux の設定の後に読む。tmux 時代 (common/tmux/.config/tmux/custom-keys.conf) の copy-mode-vi を再現する。
# y の clipboard コピーと v / C-v / Escape は plugin 側の定義を使う。
bind -T copy-mode-vi Enter send -X cancel
bind -T copy-mode-vi C-u send -X scroll-up \; send -X scroll-up \; send -X scroll-up \; send -X scroll-up
bind -T copy-mode-vi C-d send -X scroll-down \; send -X scroll-down \; send -X scroll-down \; send -X scroll-down
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi d send -X halfpage-down

# plugin の起動 hook を置き換え、prefix C-u (REX_TMUX_COPY_HALFPAGE) なら copy mode に入った直後に半ページ戻る。
set-hook -g pane-title-changed {
	if -F '#{==:#{pane_title},rex-tmux-copy-ready}' {
		copy-mode
		send -X cursor-up
		if-shell '[ -n "$REX_TMUX_COPY_HALFPAGE" ]' { send -X halfpage-up }
		set-hook -gu pane-title-changed
	}
}
