[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
node = "lts"
python = "latest"
pnpm = "latest"
deno = "latest"
"npm:cspell" = "latest"
go = "latest"
cloudflared = "latest"
"github:babashka/babashka" = { version = "latest", exe = "bb" }

[tasks.apply]
description = "Apply package declarations and dotfile links"
run = "~/dotfiles/scripts/dots apply"

[tasks.update]
description = "Fast-forward dotfiles and apply refreshed dependencies"
run = "~/dotfiles/scripts/dots update"

[tasks.check]
description = "Run the same repository checks as CI"
run = "~/dotfiles/scripts/dots check"

[tasks.doctor]
description = "Check installed tools and Stow links"
run = "~/dotfiles/scripts/dots doctor"

[tasks.lock]
description = "Refresh the cross-platform mise lockfile"
run = "~/dotfiles/scripts/dots lock"

[tasks.lint]
description = "Alias for the canonical repository checks"
run = "~/dotfiles/scripts/dots check"
