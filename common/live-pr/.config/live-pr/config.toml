# live-pr global config (stowed to ~/.config/live-pr/config.toml).
# Overlaid by any per-repo .live-pr.toml.

[diff]
# Conversation (left) : Review (right) = 2 : 8.
split_ratio = 20
# Floor for either pane so the narrow conversation column stays usable.
min_pane_width = 60

[list]
# PR list (left) : preview (right) = half and half.
split_ratio = 50

[merge]
methods = ["squash", "merge", "rebase"]

[ci]
server = "https://ci.syntopic.dev"
cli_command = ["mise", "exec", "--", "woodpecker-cli"]
token_command = ["woodpecker-token"]
