# live-pr global config (stowed to ~/.config/live-pr/config.toml).
# Overlaid by any per-repo .live-pr.toml.

[diff]
# Embedded reviewer: codereview.nvim (the built-in default calls codediff.nvim's
# :CodeDiff, which is disabled). LIVE_PR_RANGE is base...head.
command = 'nvim -c "CodeReview $LIVE_PR_RANGE"'
commit_command = 'nvim -c "CodeReview $LIVE_PR_SHA"'
# Conversation (left) : Review (right) = 2 : 8.
split_ratio = 20
# Floor for either pane so the narrow conversation column stays usable.
min_pane_width = 60

[list]
# PR list (left) : preview (right) = half and half.
split_ratio = 50

[merge]
methods = ["squash", "merge", "rebase"]

[ci]
server = "https://ci.syntopic.dev"
cli_command = ["mise", "exec", "--", "woodpecker-cli"]
token_command = ["sh", "-c", "awk '$1 == \"token:\" { print $2; exit }' \"${XDG_CONFIG_HOME:-$HOME/.config}/woodpecker-mcp/config.yaml\""]

[[views]]
name = "Needs me"
query = "(review-requested:@me OR reviewed-by:@me OR assignee:@me OR author:@me)"

[[views]]
name = "Review requested"
query = "review-requested:@me"

[[views]]
name = "All"
query = ""

[[views]]
name = "Closed"
query = "is:closed"

