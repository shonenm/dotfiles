use_default_settings:
  engines:
    keep_only:
      - bing
      - yep
      - wikipedia
      - github
      - stackoverflow
      - mdn
      - npm
      - pypi
      - huggingface
      - arxiv
      - crates.io
      - pkg.go.dev

general:
  instance_name: "SearXNG (pi research)"

search:
  formats:
    - html
    - json

server:
  secret_key: "searxng-pi-research-key"
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

# Fail fast on dead upstreams so web_search does not wait on CAPTCHA/429 engines.
outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0
